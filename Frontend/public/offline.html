<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1B3A57" />
    <title>Offline — Ustaad.com</title>
    <!--
      Self-contained, because by definition nothing else will load. The tokens
      are repeated here as literal values rather than imported: this is the one
      file in the product that cannot read the design system, and a stylesheet
      request that fails would leave an unstyled page at the worst moment.
    -->
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #F1F4F7;
        color: #1B3A57;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        line-height: 1.5;
      }
      .card {
        max-width: 32rem;
        width: 100%;
        background: #fff;
        border: 1px solid #D8E0E6;
        border-radius: 0.625rem;
        padding: 1.75rem;
        box-shadow: 0 1px 3px rgba(27, 58, 87, 0.06);
      }
      h1 { font-family: Georgia, serif; font-size: 1.5rem; margin: 0 0 0.75rem; }
      p { margin: 0 0 1rem; color: #5A6E7F; }
      ul { margin: 0 0 1.25rem; padding-left: 1.1rem; color: #5A6E7F; font-size: 0.875rem; }
      li { margin-bottom: 0.35rem; }
      button {
        min-height: 3rem;
        width: 100%;
        border: 0;
        border-radius: 0.5rem;
        background: #1B3A57;
        color: #fff;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover { background: #12293D; }
      button:focus-visible { outline: 2px solid #0A5D69; outline-offset: 2px; }
      .seal { width: 44px; height: 44px; margin-bottom: 1rem; }
    </style>
  </head>
  <body>
    <main class="card">
      <svg class="seal" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="13" fill="none" stroke="#A8763E" stroke-width="1.5" opacity="0.6" />
        <path d="M11 16.5l3.4 3.4L21 13" fill="none" stroke="#0F7B8A" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round" />
      </svg>

      <h1>You are offline</h1>
      <p>
        Ustaad.com is installed on this device, but it needs a connection to load tutor
        records — those are never stored on your phone.
      </p>
      <ul>
        <li>Nothing you had entered has been lost.</li>
        <li>Tutor profiles, bookings and messages are only ever fetched live.</li>
      </ul>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
